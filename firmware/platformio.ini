[env:m5paper-v1]
platform = espressif32@6.10.0
board = m5stack_paper
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DPAPERGIF_SERIAL_COMMANDS=1
    -DPAPERGIF_FIRMWARE_VERSION=\"1.0.7\"
lib_deps =
    m5stack/M5Unified@^0.2.8
    h2zero/NimBLE-Arduino@^2.3.7
    bblanchon/ArduinoJson@^7.3.1

[env:esp32-screenless-reference]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<reference_main.cpp>
board_build.filesystem = littlefs
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DPAPERGIF_FIRMWARE_VERSION=\"1.0.7\"
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.7
    bblanchon/ArduinoJson@^7.3.1

[env:supermini-s3-mt6701]
extends = env:esp32-screenless-reference
board = lolin_s3_mini
build_flags =
    ${env:esp32-screenless-reference.build_flags}
    -DPAPERGIF_SUPERMINI_S3=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Explicit destructive provisioning opt-in. Flash the normal reference build afterward.
[env:esp32-screenless-reference-provision]
extends = env:esp32-screenless-reference
build_flags =
    ${env:esp32-screenless-reference.build_flags}
    -DPAPERGIF_REFERENCE_FORMAT_ON_MOUNT_FAILURE=1

; Explicit destructive provisioning opt-in for a blank SuperMini filesystem.
[env:supermini-s3-mt6701-provision]
extends = env:supermini-s3-mt6701
build_flags =
    ${env:supermini-s3-mt6701.build_flags}
    -DPAPERGIF_REFERENCE_FORMAT_ON_MOUNT_FAILURE=1