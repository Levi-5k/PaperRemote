[env:m5paper-v1]
platform = espressif32@6.10.0
board = m5stack_paper
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DPAPERGIF_SERIAL_COMMANDS=1
    -DPAPERGIF_FIRMWARE_VERSION=\"1.0.8\"
lib_deps =
    m5stack/M5Unified@^0.2.8
    h2zero/NimBLE-Arduino@^2.3.7
    bblanchon/ArduinoJson@^7.3.1

[env:esp32-screenless-reference]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<reference_main.cpp>
board_build.filesystem = littlefs
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DPAPERGIF_FIRMWARE_VERSION=\"1.0.8\"
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.7
    bblanchon/ArduinoJson@^7.3.1

[env:supermini-s3-mt6701]
extends = env:esp32-screenless-reference
board = lolin_s3_mini
build_flags =
    ${env:esp32-screenless-reference.build_flags}
    -DPAPERGIF_SUPERMINI_S3=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Explicit destructive provisioning opt-in. Flash the normal reference build afterward.
[env:esp32-screenless-reference-provision]
extends = env:esp32-screenless-reference
build_flags =
    ${env:esp32-screenless-reference.build_flags}
    -DPAPERGIF_REFERENCE_FORMAT_ON_MOUNT_FAILURE=1

; Explicit destructive provisioning opt-in for a blank SuperMini filesystem.
[env:supermini-s3-mt6701-provision]
extends = env:supermini-s3-mt6701
build_flags =
    ${env:supermini-s3-mt6701.build_flags}
    -DPAPERGIF_REFERENCE_FORMAT_ON_MOUNT_FAILURE=1

; Waveshare ESP32-S3-Touch-AMOLED-1.8 V2. pioarduino 55.03.311 is Arduino 3.3.11 / IDF 5.5.5,
; required for the QSPI multiline transaction flags. 55.03.312 needs PlatformIO core >=6.2.0,
; which this pioarduino core (6.2.0-post.1) does not satisfy. Other envs stay on espressif32@6.10.0.
[env:waveshare-amoled-18-v2]
extends = env:supermini-s3-mt6701
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
build_src_filter = +<reference_main.cpp> +<waveshare_amoled_18.cpp>
build_flags =
    ${env:supermini-s3-mt6701.build_flags}
    -DPAPERGIF_WAVESHARE_AMOLED_18=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.7
    bblanchon/ArduinoJson@^7.3.1
    lvgl/lvgl@9.6.0

[env:waveshare-amoled-18-v2-provision]
extends = env:waveshare-amoled-18-v2
build_flags =
    ${env:waveshare-amoled-18-v2.build_flags}
    -DPAPERGIF_REFERENCE_FORMAT_ON_MOUNT_FAILURE=1